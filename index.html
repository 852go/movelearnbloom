<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>Move. Learn. Bloom.</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', 'Helvetica Neue', system-ui, sans-serif; }
        body { background-color: #f5f0eb; color: #2d2a24; padding: 16px 14px 40px; max-width: 520px; margin: 0 auto; }
        
        /* ===== 標題 + 語言切換 ===== */
        .app-header { 
            text-align: center; 
            margin-bottom: 18px; 
            padding: 12px 0 8px;
            background: linear-gradient(135deg, #fcf8f4 0%, #f5f0eb 100%);
            border-radius: 32px;
            position: relative;
        }
        .app-header h1 { 
            font-size: 28px; 
            font-weight: 800; 
            letter-spacing: 2px;
            background: linear-gradient(135deg, #E8485B 0%, #EC407A 40%, #2196F3 70%, #4CAF50 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            display: inline-block;
        }
        .app-header h1 i { 
            -webkit-text-fill-color: initial;
            color: #c79a6e; 
            font-size: 26px; 
            margin-right: 6px;
        }
        .app-header .sub { 
            font-size: 14px; 
            color: #5a4e42; 
            background: rgba(255,255,255,0.7);
            display: inline-block; 
            padding: 4px 20px; 
            border-radius: 30px; 
            margin-top: 4px;
            font-weight: 500;
            letter-spacing: 3px;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(200,180,165,0.3);
        }
        .app-header .tagline {
            font-size: 12px;
            color: #8a7a6a;
            margin-top: 6px;
            letter-spacing: 1px;
            font-weight: 400;
        }
        .app-header .tagline span { display: inline-block; margin: 0 6px; }
        .app-header .tagline .move { color: #E8485B; font-weight: 600; }
        .app-header .tagline .learn { color: #2196F3; font-weight: 600; }
        .app-header .tagline .bloom { color: #4CAF50; font-weight: 600; }

        /* 語言切換按鈕 */
        .lang-switch {
            position: absolute;
            top: 12px;
            right: 16px;
            background: rgba(255,255,255,0.8);
            border: 1px solid #d0c8c0;
            border-radius: 30px;
            padding: 4px 12px;
            font-size: 12px;
            font-weight: 600;
            color: #3d352c;
            cursor: pointer;
            transition: 0.2s;
            backdrop-filter: blur(4px);
        }
        .lang-switch:hover { background: white; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
        .lang-switch:active { transform: scale(0.94); }

        /* ===== 其餘樣式與之前相同 ===== */
        .tab-bar {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 18px;
        }
        .tab-btn {
            background: white;
            border: 2px solid #e2dad2;
            border-radius: 40px;
            padding: 10px 0;
            text-align: center;
            font-weight: 700;
            font-size: 15px;
            color: #5f5345;
            cursor: pointer;
            transition: 0.2s;
        }
        .tab-btn i { margin-right: 6px; }
        .tab-btn.active { border-color: #c79a6e; background: #fcf8f4; color: #2d2a24; }
        .tab-btn:active { transform: scale(0.96); }

        .district-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
            margin-bottom: 18px;
        }
        .district-card {
            background: white;
            border-radius: 16px;
            padding: 14px 6px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            border: 3px solid #e2dad2;
            cursor: pointer;
            transition: 0.25s;
            font-weight: 600;
            font-size: 14px;
            color: #3d352c;
            position: relative;
        }
        .district-card i { display: block; font-size: 26px; margin-bottom: 4px; transition: 0.3s; }
        .district-card .badge { font-size: 10px; font-weight: 400; background: #e8dfd7; padding: 1px 10px; border-radius: 30px; display: inline-block; margin-top: 3px; color: #4f453a; }
        .district-card .progress-dot { display: block; font-size: 11px; margin-top: 4px; font-weight: 500; }
        .district-card.active { transform: scale(1.03); box-shadow: 0 6px 18px rgba(0,0,0,0.12); }
        .district-card.completed { opacity: 0.9; }
        .district-card.partial { opacity: 0.95; }

        .district-tst { border-color: #E8485B; }
        .district-tst i { color: #E8485B; }
        .district-tst.active { border-color: #E8485B; background: #FCE8EA; box-shadow: 0 6px 18px rgba(232,72,91,0.25); }
        .district-tst .progress-dot { color: #E8485B; }

        .district-kc { border-color: #F5A623; }
        .district-kc i { color: #F5A623; }
        .district-kc.active { border-color: #F5A623; background: #FEF3E0; box-shadow: 0 6px 18px rgba(245,166,35,0.25); }
        .district-kc .progress-dot { color: #F5A623; }

        .district-southern { border-color: #2196F3; }
        .district-southern i { color: #2196F3; }
        .district-southern.active { border-color: #2196F3; background: #E3F2FD; box-shadow: 0 6px 18px rgba(33,150,243,0.25); }
        .district-southern .progress-dot { color: #2196F3; }

        .district-ssp { border-color: #9C27B0; }
        .district-ssp i { color: #9C27B0; }
        .district-ssp.active { border-color: #9C27B0; background: #F3E5F5; box-shadow: 0 6px 18px rgba(156,39,176,0.25); }
        .district-ssp .progress-dot { color: #9C27B0; }

        .district-sk { border-color: #4CAF50; }
        .district-sk i { color: #4CAF50; }
        .district-sk.active { border-color: #4CAF50; background: #E8F5E9; box-shadow: 0 6px 18px rgba(76,175,80,0.25); }
        .district-sk .progress-dot { color: #4CAF50; }

        .district-tp { border-color: #FF6F00; }
        .district-tp i { color: #FF6F00; }
        .district-tp.active { border-color: #FF6F00; background: #FFF3E0; box-shadow: 0 6px 18px rgba(255,111,0,0.25); }
        .district-tp .progress-dot { color: #FF6F00; }

        .district-card.completed { border-color: #28a745 !important; }
        .district-card.completed i { color: #28a745 !important; }
        .district-card.completed .progress-dot { color: #28a745 !important; }
        .district-card.completed.active { background: #f0f8f0 !important; box-shadow: 0 6px 18px rgba(40,167,69,0.25) !important; }

        .route-selector {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 1fr;
            gap: 8px;
            margin-bottom: 16px;
        }
        .route-card {
            background: white;
            border-radius: 14px;
            padding: 10px 4px;
            text-align: center;
            border: 2px solid #e2dad2;
            cursor: pointer;
            transition: 0.2s;
            font-weight: 600;
            font-size: 12px;
            color: #3d352c;
            box-shadow: 0 2px 6px rgba(0,0,0,0.04);
        }
        .route-card i { display: block; font-size: 20px; margin-bottom: 2px; color: #8a7a6a; }
        .route-card .badge { font-size: 9px; font-weight: 400; background: #e8dfd7; padding: 1px 8px; border-radius: 30px; display: inline-block; margin-top: 2px; color: #4f453a; }
        .route-card.active { border-color: #c79a6e; background: #fcf8f4; }
        .route-card:active { transform: scale(0.94); }

        .map-container { background: #d9d2c9; border-radius: 28px; padding: 16px 14px 14px; margin-bottom: 16px; box-shadow: inset 0 2px 6px rgba(0,0,0,0.08); }
        .map-title { font-weight: 600; font-size: 14px; color: #2d2a24; margin-bottom: 10px; display: flex; justify-content: space-between; }
        .map-grid { background: #eae3da; border-radius: 20px; padding: 12px 10px; min-height: 180px; background-image: linear-gradient(rgba(200,185,170,0.2) 1px, transparent 1px), linear-gradient(90deg, rgba(200,185,170,0.2) 1px, transparent 1px); background-size: 20px 20px; }
        .map-pin {
            background: white;
            border-radius: 30px;
            padding: 8px 12px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            border-left: 4px solid #c79a6e;
            font-size: 13px;
            transition: 0.2s;
        }
        .map-pin .pin-icon { font-size: 18px; color: #1a3c4a; width: 24px; text-align: center; }
        .map-pin .pin-info { flex: 1; }
        .map-pin .pin-name { font-weight: 600; font-size: 14px; }
        .map-pin .pin-desc { font-size: 11px; color: #5f5345; display: flex; flex-wrap: wrap; gap: 4px 8px; margin-top: 1px; }
        .facility-tags { display: flex; flex-wrap: wrap; gap: 4px 10px; margin: 4px 0 2px; font-size: 10px; color: #2d4b4f; }
        .facility-tags i { margin-right: 2px; }
        .wheelchair-tip { background: #e1eef0; border-radius: 30px; padding: 2px 10px; font-size: 10px; display: inline-flex; align-items: center; gap: 4px; color: #005566; margin-top: 2px; }
        .pet-tip { background: #d4edda; border-radius: 30px; padding: 2px 10px; font-size: 10px; display: inline-flex; align-items: center; gap: 4px; color: #155724; margin-top: 2px; }
        .pet-tip.caution { background: #fff3cd; color: #856404; }
        .pet-tip.no { background: #f8d7da; color: #721c24; }
        .stamp-btn {
            background: #1a3c4a;
            color: white;
            border: none;
            padding: 4px 12px;
            border-radius: 40px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            white-space: nowrap;
        }
        .stamp-btn:active { transform: scale(0.92); }
        .stamp-btn:disabled { cursor: default; opacity: 0.7; }
        .stamp-btn.tst-btn { background: #E8485B; }
        .stamp-btn.tst-btn.stamped { background: #c0392b; }
        .stamp-btn.kc-btn { background: #F5A623; }
        .stamp-btn.kc-btn.stamped { background: #d4891b; }
        .stamp-btn.southern-btn { background: #2196F3; }
        .stamp-btn.southern-btn.stamped { background: #1976D2; }
        .stamp-btn.ssp-btn { background: #9C27B0; }
        .stamp-btn.ssp-btn.stamped { background: #7B1FA2; }
        .stamp-btn.sk-btn { background: #4CAF50; }
        .stamp-btn.sk-btn.stamped { background: #388E3C; }
        .stamp-btn.tp-btn { background: #FF6F00; }
        .stamp-btn.tp-btn.stamped { background: #E65100; }
        .stamp-btn.stamped { background: #c79a6e; }

        .progress-area { background: white; border-radius: 24px; padding: 12px 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); margin: 8px 0 14px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; }
        .progress-area .count { font-weight: 700; font-size: 17px; color: #1a3c4a; }
        .progress-area .count span { color: #c79a6e; }
        .progress-bar-bg { width: 100%; height: 5px; background: #e2dad2; border-radius: 20px; margin-top: 4px; overflow: hidden; }
        .progress-bar-fill { height: 100%; border-radius: 20px; width: 0%; transition: 0.4s; }

        #overviewPanel { display: none; }
        #overviewPanel .overview-stats { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 16px; }
        #overviewPanel .stat-box { background: white; border-radius: 16px; padding: 14px 8px; text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        #overviewPanel .stat-box .num { font-size: 28px; font-weight: 700; color: #1a3c4a; }
        #overviewPanel .stat-box .label { font-size: 12px; color: #6b5e4e; margin-top: 2px; }
        #overviewPanel .district-list { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        #overviewPanel .district-item {
            background: white;
            border-radius: 14px;
            padding: 12px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 6px rgba(0,0,0,0.04);
            border-left: 4px solid #d9d2c9;
            transition: 0.2s;
        }
        #overviewPanel .district-item .name { font-weight: 600; font-size: 14px; }
        #overviewPanel .district-item .progress-text { font-size: 13px; color: #5f5345; }
        #overviewPanel .district-item .mini-bar { width: 60px; height: 4px; background: #e2dad2; border-radius: 10px; margin-top: 2px; overflow: hidden; }
        #overviewPanel .district-item .mini-bar .fill { height: 100%; border-radius: 10px; transition: 0.4s; }

        .legend { display: flex; flex-wrap: wrap; gap: 6px 12px; background: white; padding: 8px 12px; border-radius: 40px; font-size: 10px; color: #3d3a34; box-shadow: 0 2px 6px rgba(0,0,0,0.04); margin-top: 6px; }
        .legend i { margin-right: 2px; color: #2d5f6b; }
        .toast-message { background: #1a3c4a; color: white; padding: 10px 16px; border-radius: 60px; text-align: center; font-weight: 500; margin: 12px 0 4px; font-size: 14px; box-shadow: 0 6px 18px rgba(0,0,0,0.12); display: none; }
        .toast-message.show { display: block; }
        .back-hint { text-align: center; font-size: 11px; color: #8a7a6a; margin-top: 10px; }
        .back-hint i { margin-right: 4px; }
        .section-label { font-size: 13px; font-weight: 600; color: #4f453a; margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
        .section-label i { color: #a67c52; }

        .stamp-flower {
            display: inline-block;
            font-size: 16px;
            margin-left: 4px;
            animation: flowerPop 0.4s ease-out;
        }
        @keyframes flowerPop {
            0% { transform: scale(0) rotate(-30deg); opacity: 0; }
            70% { transform: scale(1.3) rotate(10deg); opacity: 1; }
            100% { transform: scale(1) rotate(0deg); }
        }

        @media (max-width: 420px) {
            .district-grid { grid-template-columns: 1fr 1fr; }
            .route-selector { grid-template-columns: 1fr 1fr; }
            .district-card { font-size: 12px; padding: 10px 4px; }
            .route-card { font-size: 11px; padding: 8px 4px; }
            #overviewPanel .district-list { grid-template-columns: 1fr; }
            .map-pin { flex-wrap: wrap; }
            .stamp-btn { width: 100%; margin-top: 4px; }
            .app-header h1 { font-size: 22px; }
            .lang-switch { top: 8px; right: 10px; font-size: 10px; padding: 2px 10px; }
        }
    </style>
</head>
<body>

<div class="app-header">
    <button class="lang-switch" id="langSwitch">English</button>
    <h1><i class="fas fa-stamp"></i> <span id="appTitle">Move. Learn. Bloom.</span></h1>
    <div class="sub"><span id="appSub">✦ 躍動 · 發現 · 綻放 ✦</span></div>
    <div class="tagline">
        <span class="move" id="tagMove">行一步</span>
        <span>·</span>
        <span class="learn" id="tagLearn">學一課</span>
        <span>·</span>
        <span class="bloom" id="tagBloom">開一朵花</span>
    </div>
</div>

<div class="tab-bar">
    <div class="tab-btn active" data-tab="map" id="tabMap"><i class="fas fa-map-marked-alt"></i> <span id="tabMapLabel">地區遊</span></div>
    <div class="tab-btn" data-tab="overview" id="tabOverview"><i class="fas fa-chart-simple"></i> <span id="tabOverviewLabel">總進度</span></div>
</div>

<div id="mapPanel">
    <div class="section-label"><i class="fas fa-map-marker-alt"></i> <span id="sectionDistrict">揀地區</span></div>
    <div class="district-grid" id="districtGrid"></div>

    <div class="section-label"><i class="fas fa-route"></i> <span id="sectionRoute">揀路線</span></div>
    <div class="route-selector" id="routeSelector"></div>

    <div class="map-container">
        <div class="map-title">
            <span><i class="fas fa-map-pin" style="color:#a67c52;"></i> <span id="districtNameDisplay">尖沙咀</span><span id="spotsLabel">景點</span></span>
            <span style="font-size:12px;"><i class="fas fa-flag-checkered"></i> <span id="stampCollectLabel">蓋章收集</span></span>
        </div>
        <div class="map-grid" id="mapGrid"></div>
    </div>

    <div class="progress-area">
        <div>
            <div class="count"><span id="stampCount">0</span> / <span id="totalSpots">0</span> <span id="stampsLabel">個印章</span></div>
            <div class="progress-bar-bg"><div class="progress-bar-fill" id="progressFill"></div></div>
        </div>
        <div style="font-size:13px; color:#5f5345;"><i class="fas fa-award"></i> <span id="badgeDisplay">🌱 起步者</span></div>
    </div>

    <div class="legend">
        <span><i class="fas fa-restroom"></i> <span id="legendToilet">公廁</span></span>
        <span><i class="fas fa-parking"></i> <span id="legendParking">停車場</span></span>
        <span><i class="fas fa-bus"></i> <span id="legendBus">公交站</span></span>
        <span><i class="fas fa-wheelchair"></i> <span id="legendWheelchair">無障礙</span></span>
        <span><i class="fas fa-baby"></i> <span id="legendBaby">育嬰室</span></span>
        <span><i class="fas fa-paw"></i> <span id="legendPet">寵物友善</span></span>
        <span>🌸 <span id="legendStamped">已蓋章</span></span>
    </div>
</div>

<div id="overviewPanel">
    <div class="overview-stats">
        <div class="stat-box"><div class="num" id="totalDistricts">0</div><div class="label" id="statDistricts">已開發地區</div></div>
        <div class="stat-box"><div class="num" id="totalSpotsAll">0</div><div class="label" id="statSpots">總景點數</div></div>
        <div class="stat-box"><div class="num" id="totalStampsAll">0</div><div class="label" id="statStamps">已蓋章</div></div>
    </div>
    <div class="section-label"><i class="fas fa-list"></i> <span id="sectionOverview">各地區進度</span></div>
    <div class="district-list" id="overviewList"></div>
</div>

<div class="toast-message" id="toastMsg"><i class="fas fa-check-circle"></i> <span id="toastText">蓋章成功！</span></div>
<div class="back-hint"><i class="fas fa-arrow-up"></i> <span id="hintText">點擊地區或路線可切換</span></div>

<script>
    // ============================================================
    // 語言文字對照表
    // ============================================================
    const langTexts = {
        zh: {
            appSub: '✦ 躍動 · 發現 · 綻放 ✦',
            tagMove: '行一步',
            tagLearn: '學一課',
            tagBloom: '開一朵花',
            tabMap: '地區遊',
            tabOverview: '總進度',
            sectionDistrict: '揀地區',
            sectionRoute: '揀路線',
            spotsLabel: '景點',
            stampCollectLabel: '蓋章收集',
            stampsLabel: '個印章',
            legendToilet: '公廁',
            legendParking: '停車場',
            legendBus: '公交站',
            legendWheelchair: '無障礙',
            legendBaby: '育嬰室',
            legendPet: '寵物友善',
            legendStamped: '已蓋章',
            statDistricts: '已開發地區',
            statSpots: '總景點數',
            statStamps: '已蓋章',
            sectionOverview: '各地區進度',
            toastSuccess: '🌸 蓋章成功！繼續 Move. Learn. Bloom. 🌸',
            toastAlready: '已經蓋咗章啦！',
            hint: '點擊地區或路線可切換',
            badgeStart: '🌱 起步者',
            badgeExplorer: '⭐ 探險家',
            badgeNovice: '🌱 初心者',
            badgeMaster: (name) => `🌸 ${name}通`,
            routeLabels: {
                romance: '浪漫',
                family: '親子',
                friends: '朋友',
                silver: '銀髮'
            },
            routeIntros: {
                romance: '💕 海濱漫步 · 二人世界',
                family: '👨‍👩‍👧‍👦 放電學習 · 親子同樂',
                friends: '📸 打卡熱點 · 好友同遊',
                silver: '🧓 懷舊慢活 · 舒適出行'
            },
            districtNames: {
                tst: '尖沙咀',
                kc: '九龍城',
                southern: '南區',
                ssp: '深水埗',
                sk: '西貢',
                tp: '大埔'
            },
            spotNames: {
                // 尖沙咀
                tst1: '星光大道', tst2: '香港文化中心', tst3: '海港城海運大廈',
                tst4: '九龍公園', tst5: '1881 Heritage', tst6: '天星小輪碼頭', tst7: '尖沙咀清真寺',
                // 九龍城
                kc1: '九龍寨城公園', kc2: '侯王廟', kc3: '九龍城廣場',
                kc4: '衙前圍村', kc5: '啟德機場跑道公園', kc6: '九龍仔公園',
                kc7: '石屋家園', kc8: '格仔山',
                // 南區
                s1: '香港仔避風塘', s2: '流記艇仔粉', s3: '赤柱海濱長廊',
                s4: '南區海濱長廊', s5: '赤柱卜公碼頭',
                // 深水埗
                ss1: '美荷樓生活館', ss2: '賽馬會創意藝術中心 JCCAC',

    function setLanguage(lang) {
        currentLang = lang;
        const t = langTexts[lang];
        document.getElementById('appSub').textContent = t.appSub;
        document.getElementById('tagMove').textContent = t.tagMove;
        document.getElementById('tagLearn').textContent = t.tagLearn;
        document.getElementById('tagBloom').textContent = t.tagBloom;
        document.getElementById('tabMapLabel').textContent = t.tabMap;
        document.getElementById('tabOverviewLabel').textContent = t.tabOverview;
        document.getElementById('sectionDistrict').textContent = t.sectionDistrict;
        document.getElementById('sectionRoute').textContent = t.sectionRoute;
        document.getElementById('spotsLabel').textContent = t.spotsLabel;
        document.getElementById('stampCollectLabel').textContent = t.stampCollectLabel;
        document.getElementById('stampsLabel').textContent = t.stampsLabel;
        document.getElementById('legendToilet').textContent = t.legendToilet;
        document.getElementById('legendParking').textContent = t.legendParking;
        document.getElementById('legendBus').textContent = t.legendBus;
        document.getElementById('legendWheelchair').textContent = t.legendWheelchair;
        document.getElementById('legendBaby').textContent = t.legendBaby;
        document.getElementById('legendPet').textContent = t.legendPet;
        document.getElementById('legendStamped').textContent = t.legendStamped;
        document.getElementById('statDistricts').textContent = t.statDistricts;
        document.getElementById('statSpots').textContent = t.statSpots;
        document.getElementById('statStamps').textContent = t.statStamps;
        document.getElementById('sectionOverview').textContent = t.sectionOverview;
        hintText.textContent = t.hint;
        langSwitch.textContent = lang === 'zh' ? 'English' : '中文';
        // 重新渲染所有動態內容
        renderDistricts();
        renderRoutes();
        renderMap();
        updateOverview();
        // 儲存語言偏好
        localStorage.setItem('mlb_lang', lang);
    }

    function toggleLang() {
        const nextLang = currentLang === 'zh' ? 'en' : 'zh';
        setLanguage(nextLang);
    }

    // ============================================================
    // 輔助函數：取得語言文字
    // ============================================================
    function getText(key, ...args) {
        const t = langTexts[currentLang];
        if (typeof t[key] === 'function') return t[key](...args);
        return t[key] || key;
    }

    function getDistrictName(id) {
        return getText('districtNames')[id] || id;
    }

    function getSpotName(id) {
        return getText('spotNames')[id] || id;
    }

    function getSpotDesc(id) {
        return getText('spotDescs')[id] || '';
    }

    function getRouteLabel(key) {
        return getText('routeLabels')[key] || key;
    }

    function getRouteIntro(key) {
        return getText('routeIntros')[key] || '';
    }

    // ============================================================
    // 渲染函數
    // ============================================================
    function renderDistricts() {
        let html = '';
        districtKeys.forEach(key => {
            const d = districtData[key];
            if (!d) return;
            const dStamps = stamps[key] || {};
            const totalSpots = d.spots.length;
            const done = d.spots.filter(s => dStamps[s.id]).length;
            const pct = totalSpots > 0 ? Math.round((done / totalSpots) * 100) : 0;
            let statusClass = '', statusText = '';
            if (done === totalSpots && totalSpots > 0) { statusClass = 'completed'; statusText = getText('completed'); }
            else if (done > 0) { statusClass = 'partial'; statusText = pct + '%'; }
            else { statusText = getText('notStarted'); }
            const isActive = (key === currentDistrict);
            const colorInfo = colorMap[key] || { primary: '#c79a6e', light: '#fcf8f4' };
            const name = getDistrictName(key);
            html += `
                <div class="district-card district-${key} ${statusClass} ${isActive ? 'active' : ''}" data-district="${key}">
                    <i class="fas ${d.icon}" style="color: ${isActive ? colorInfo.primary : ''};"></i>
                    ${name}
                    <span class="badge">${d.spots.length} ${getText('spotsLabel')}</span>
                    <span class="progress-dot">${statusText}</span>
                </div>
            `;
        });
        districtGrid.innerHTML = html;
        document.querySelectorAll('.district-card').forEach(card => {
            card.addEventListener('click', function() {
                const key = this.dataset.district;
                if (key && key !== currentDistrict) {
                    currentDistrict = key;
                    const routeKeys = Object.keys(districtData[key].routes);
                    currentRoute = routeKeys[0] || 'romance';
                    renderDistricts();
                    renderRoutes();
                    renderMap();
                    updateOverview();
                }
            });
        });
    }

    function renderRoutes() {
        const d = districtData[currentDistrict];
        if (!d) return;
        const routeKeys = Object.keys(d.routes);
        let html = '';
        routeKeys.forEach(key => {
            const r = d.routes[key];
            const isActive = (key === currentRoute);
            const iconMap = { 'romance': 'fa-heart', 'family': 'fa-child', 'friends': 'fa-users', 'silver': 'fa-walking' };
            const label = getRouteLabel(key);
            html += `
                <div class="route-card ${isActive ? 'active' : ''}" data-route="${key}">
                    <i class="fas ${iconMap[key] || 'fa-route'}"></i> ${label}
                    <span class="badge">${r.order.length}</span>
                </div>
            `;
        });
        routeSelector.innerHTML = html;
        document.querySelectorAll('.route-card').forEach(card => {
            card.addEventListener('click', function() {
                const route = this.dataset.route;
                if (route && route !== currentRoute) {
                    currentRoute = route;
                    renderRoutes();
                    renderMap();
                }
            });
        });
    }

    function renderMap() {
        const d = districtData[currentDistrict];
        if (!d) return;
        const route = d.routes[currentRoute];
        if (!route) return;
        const colorInfo = colorMap[currentDistrict] || { primary: '#c79a6e', light: '#fcf8f4' };

        const name = getDistrictName(currentDistrict);
        districtNameDisplay.textContent = name;
        progressFill.style.background = colorInfo.primary;

        const dStamps = stamps[currentDistrict] || {};
        const order = route.order;
        const intro = getRouteIntro(currentRoute);
        let html = `<div style="font-size:12px; color:#4f453a; margin-bottom:8px; font-weight:500;">
            <i class="fas fa-route"></i> ${intro}
        </div>`;

        order.forEach((spotId) => {
            const spot = d.spots.find(s => s.id === spotId);
            if (!spot) return;

            const isStamped = dStamps[spotId] || false;
            const stampClass = isStamped ? 'stamped' : '';
            const stampText = isStamped ? getText('stampedBtn') : getText('stampBtn');
            const btnColorClass = `${currentDistrict}-btn`;

            const flowerHtml = isStamped ? `<span class="stamp-flower">🌸</span>` : '';

            // 設施
            const facMap = {
                '廁所': getText('facilities').toilet,
                '停車': getText('facilities').parking,
                '公交': getText('facilities').bus
            };
            let facilitiesHtml = spot.facilities.map(f => {
                const label = facMap[f] || f;
                const iconMap = { '廁所': 'fa-restroom', '停車': 'fa-parking', '公交': 'fa-bus' };
                return `<span><i class="fas ${iconMap[f] || 'fa-circle-check'}"></i> ${label}</span>`;
            }).join('');

            let babyHtml = '';
            if (currentRoute === 'family' && spot.babyRoom) {
                babyHtml = `<span><i class="fas fa-baby"></i> ${getText('babyRoom')}</span>`;
            }

            let wheelchairHtml = '';
            if (spot.wheelchair) {
                wheelchairHtml = `<span class="wheelchair-tip"><i class="fas fa-wheelchair"></i> ${getText('wheelchair')}</span>`;
            } else {
                wheelchairHtml = `<span class="wheelchair-tip" style="background:#f5d6d6; color:#8b3a3a;"><i class="fas fa-exclamation-triangle"></i> ${getText('stair')}</span>`;
            }

            let petHtml = '';
            const petMap = getText('petLabels');
            if (spot.petFriendly) {
                const petLabel = petMap[spot.petFriendly] || spot.petFriendly;
                const petClassMap = { 'yes': 'pet-tip', 'caution': 'pet-tip caution', 'no': 'pet-tip no', 'unknown': 'pet-tip caution' };
                petHtml = `<span class="${petClassMap[spot.petFriendly] || 'pet-tip'}"><i class="fas fa-paw"></i> ${petLabel}</span>`;
            }

            let specialNote = '';
            if (spot.id === 's5') {
                specialNote = `<div style="font-size:10px; color:#1a6b7a; background:#d4edf0; border-radius:30px; padding:2px 10px; display:inline-block; margin-top:2px;">
                    <i class="fas fa-ferry"></i> ${getText('ferryNote')}
                </div>`;
            }

            let rentalHtml = '';
            if (currentRoute === 'silver' && spot.rental) {
                rentalHtml = `<div style="font-size:10px; color:#005566; background:#e1eef0; border-radius:30px; padding:2px 10px; display:inline-block; margin-top:2px;">
                    <i class="fas fa-hand-holding-heart"></i> ${getText('rental')}${spot.rental}
                </div>`;
            }

            let silverExtra = '';
            if (currentRoute === 'silver' && spot.silverTip) {
                silverExtra = `<div style="font-size:10px; color:#2d5f6b; background:#f0f3f0; border-radius:20px; padding:2px 10px; margin-top:2px;">
                    <i class="fas fa-lightbulb"></i> ${getText('silverTip')}${spot.silverTip}
                </div>`;
            }

            const spotName = getSpotName(spotId);
            const spotDesc = getSpotDesc(spotId);

            html += `
                <div class="map-pin" style="border-left-color: ${isStamped ? colorInfo.primary : '#a0b8c5'};">
                    <div class="pin-icon"><i class="fas ${spot.icon}" style="color: ${isStamped ? colorInfo.primary : '#1a3c4a'};"></i></div>
                    <div class="pin-info">
                        <div class="pin-name">${spotName} ${flowerHtml}</div>
                        <div class="pin-desc">${spotDesc}</div>
                        <div class="facility-tags">${facilitiesHtml} ${wheelchairHtml} ${babyHtml} ${petHtml}</div>
                        ${specialNote}
                        ${rentalHtml}
                        ${silverExtra}
                    </div>
                    <button class="stamp-btn ${btnColorClass} ${stampClass}" data-id="${spot.id}" ${isStamped ? 'disabled' : ''}>
                        ${stampText}
                    </button>
                </div>
            `;
        });

        mapGrid.innerHTML = html;
        totalSpotsEl.textContent = order.length;

        document.querySelectorAll('.stamp-btn:not([disabled])').forEach(btn => {
            btn.addEventListener('click', function() {
                const id = this.dataset.id;
                handleStamp(id);
            });
        });

        updateProgress();
        updateOverview();
    }

    function handleStamp(spotId) {
        const dStamps = stamps[currentDistrict] || {};
        if (dStamps[spotId]) {
            toastText.textContent = getText('toastAlready');
            toastMsg.classList.add('show');
            setTimeout(() => toastMsg.classList.remove('show'), 1500);
            return;
        }
        dStamps[spotId] = true;
        stamps[currentDistrict] = dStamps;
        toastText.textContent = getText('toastSuccess');
        toastMsg.classList.add('show');
        setTimeout(() => toastMsg.classList.remove('show'), 2500);
        renderMap();
        renderDistricts();
        updateOverview();
    }

    function updateProgress() {
        const d = districtData[currentDistrict];
        if (!d) return;
        const route = d.routes[currentRoute];
        if (!route) return;
        const dStamps = stamps[currentDistrict] || {};
        const total = route.order.length;
        const done = route.order.filter(id => dStamps[id]).length;
        const percent = total > 0 ? (done / total) * 100 : 0;
        stampCountEl.textContent = done;
        progressFill.style.width = Math.min(percent, 100) + '%';
        let badge = getText('badgeStart');
        if (done === total && total > 0) {
            const name = getDistrictName(currentDistrict);
            badge = getText('badgeMaster', name);
        } else if (done >= Math.ceil(total * 0.6)) {
            badge = getText('badgeExplorer');
        } else if (done >= Math.ceil(total * 0.3)) {
            badge = getText('badgeNovice');
        }
        badgeDisplay.textContent = badge;
    }

    function updateOverview() {
        let totalDistricts = 0, totalSpotsAll = 0, totalStampsAll = 0;
        let listHtml = '';
        districtKeys.forEach(key => {
            const d = districtData[key];
            if (!d) return;
            const dStamps = stamps[key] || {};
            const spots = d.spots;
            const done = spots.filter(s => dStamps[s.id]).length;
            const total = spots.length;
            const pct = total > 0 ? Math.round((done / total) * 100) : 0;
            const colorInfo = colorMap[key] || { primary: '#d9d2c9' };
            totalDistricts++; totalSpotsAll += total; totalStampsAll += done;
            let statusIcon = '⏳', statusColor = '#d9d2c9';
            if (done === total && total > 0) { statusIcon = '🌸'; statusColor = '#28a745'; }
            else if (done > 0) { statusIcon = '🔄'; statusColor = colorInfo.primary; }
            const name = getDistrictName(key);
            listHtml += `
                <div class="district-item" style="border-left-color: ${statusColor};">
                    <div>
                        <div class="name"><i class="fas ${d.icon}" style="color:${colorInfo.primary}; width:18px;"></i> ${statusIcon} ${name}</div>
                        <div class="progress-text">${done} / ${total} ${getText('overviewProgress')}</div>
                    </div>
                    <div style="text-align:right;">
                        <div style="font-size:16px; font-weight:700; color:${colorInfo.primary};">${pct}%</div>
                        <div class="mini-bar"><div class="fill" style="width:${pct}%; background:${colorInfo.primary};"></div></div>
                    </div>
                </div>
            `;
        });
        document.getElementById('totalDistricts').textContent = totalDistricts;
        document.getElementById('totalSpotsAll').textContent = totalSpotsAll;
        document.getElementById('totalStampsAll').textContent = totalStampsAll;
        document.getElementById('overviewList').innerHTML = listHtml;
    }

    // ============================================================
    // 頁籤切換
    // ============================================================
    document.getElementById('tabMap').addEventListener('click', function() {
        this.classList.add('active');
        document.getElementById('tabOverview').classList.remove('active');
        document.getElementById('mapPanel').style.display = 'block';
        document.getElementById('overviewPanel').style.display = 'none';
    });
    document.getElementById('tabOverview').addEventListener('click', function() {
        this.classList.add('active');
        document.getElementById('tabMap').classList.remove('active');
        document.getElementById('mapPanel').style.display = 'none';
        document.getElementById('overviewPanel').style.display = 'block';
        updateOverview();
    });

    // ============================================================
    // 語言切換事件
    // ============================================================
    langSwitch.addEventListener('click', toggleLang);

    // ============================================================
    // 啟動 App
    // ============================================================
    // 讀取之前儲存嘅語言偏好
    const savedLang = localStorage.getItem('mlb_lang') || 'zh';
    setLanguage(savedLang);
    // 但因為 setLanguage 會重新渲染，但初始狀態要設好
    // 確保 currentDistrict 同 currentRoute 已設定
    renderDistricts();
    renderRoutes();
    renderMap();
    updateOverview();
    document.getElementById('mapPanel').style.display = 'block';
    document.getElementById('overviewPanel').style.display = 'none';
</script>
</body>
</html>
